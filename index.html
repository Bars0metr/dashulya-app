<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-pink-500/30">

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Lucide Icon Wrapper ---

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);

    };

    const BookOpen = (p) => <Icon name="book-open" {...p} />;
    const Calendar = (p) => <Icon name="calendar" {...p} />;
    const CheckCircle2 = (p) => <Icon name="check-circle-2" {...p} />;
    const Clock = (p) => <Icon name="clock" {...p} />;
    const Plus = (p) => <Icon name="plus" {...p} />;
    const Search = (p) => <Icon name="search" {...p} />;
    const SettingsIcon = (p) => <Icon name="settings" {...p} />;
    const Home = (p) => <Icon name="home" {...p} />;
    const User = (p) => <Icon name="user" {...p} />;
    const AlertTriangle = (p) => <Icon name="alert-triangle" {...p} />;
    const Sparkles = (p) => <Icon name="sparkles" {...p} />;

    const Edit3 = (p) => <Icon name="edit-3" {...p} />;
    const X = (p) => <Icon name="x" {...p} />;
    const Upload = (p) => <Icon name="upload" {...p} />;
    const Check = (p) => <Icon name="check" {...p} />;
    const Smartphone = (p) => <Icon name="smartphone" {...p} />;
    const Tablet = (p) => <Icon name="tablet" {...p} />;
    const Monitor = (p) => <Icon name="monitor" {...p} />;
    const Download = (p) => <Icon name="download" {...p} />;
    const Share2 = (p) => <Icon name="share-2" {...p} />;
    const History = (p) => <Icon name="history" {...p} />;
    const Database = (p) => <Icon name="database" {...p} />;
    const Sliders = (p) => <Icon name="sliders" {...p} />;

    // --- 17 THEMES PRESETS ---

      { id: 'midnight', name: 'Midnight Glass', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)', glassBg: 'rgba(30, 41, 59, 0.65)', glassBorder: 'rgba(255, 255, 255, 0.12)', primary: '#38bdf8', text: '#f8fafc', cardBg: 'rgba(15, 23, 42, 0.6)', icon: '🌙' },
      { id: 'autumn', name: 'Autumn Amber', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #451a03 0%, #78350f 50%, #b45309 100%)', glassBg: 'rgba(120, 53, 15, 0.45)', glassBorder: 'rgba(251, 191, 36, 0.3)', primary: '#f59e0b', text: '#fef3c7', cardBg: 'rgba(69, 26, 3, 0.55)', icon: '🍂' },
      { id: 'winter', name: 'Winter Frost', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%)', glassBg: 'rgba(255, 255, 255, 0.6)', glassBorder: 'rgba(255, 255, 255, 0.8)', primary: '#0284c7', text: '#0f172a', cardBg: 'rgba(255, 255, 255, 0.7)', icon: '❄️' },

      { id: 'witch_night', name: 'Ведьминская ночь', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #050505 0%, #1a0033 50%, #330066 100%)', glassBg: 'rgba(51, 0, 102, 0.35)', glassBorder: 'rgba(168, 85, 247, 0.4)', primary: '#c084fc', text: '#f3e8ff', cardBg: 'rgba(10, 0, 20, 0.7)', icon: '🔮' },
      { id: 'new_year', name: 'Новый год', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #064e3b 0%, #022c22 50%, #7f1d1d 100%)', glassBg: 'rgba(6, 78, 59, 0.5)', glassBorder: 'rgba(252, 211, 77, 0.4)', primary: '#fbbf24', text: '#ecfdf5', cardBg: 'rgba(2, 44, 34, 0.65)', icon: '🎄' },
      { id: 'christmas', name: 'Рождество', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #991b1b 0%, #450a0a 100%)', glassBg: 'rgba(153, 27, 27, 0.45)', glassBorder: 'rgba(254, 240, 138, 0.5)', primary: '#fef08a', text: '#fff1f2', cardBg: 'rgba(69, 10, 10, 0.6)', icon: '🎁' },
      { id: 'valentines', name: 'День Святого Валентина', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #be123c 0%, #881337 50%, #4c0519 100%)', glassBg: 'rgba(190, 18, 60, 0.4)', glassBorder: 'rgba(251, 113, 133, 0.5)', primary: '#fb7185', text: '#fff1f2', cardBg: 'rgba(76, 5, 25, 0.65)', icon: '💖' },
      { id: 'birthday', name: 'День рождения', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f43f5e 100%)', glassBg: 'rgba(255, 255, 255, 0.25)', glassBorder: 'rgba(255, 255, 255, 0.5)', primary: '#fef08a', text: '#ffffff', cardBg: 'rgba(139, 92, 246, 0.45)', icon: '🎂' },
      { id: 'flower_garden', name: 'Цветочный сад', category: 'Природа', bgGradient: 'linear-gradient(135deg, #d9f99d 0%, #4ade80 50%, #059669 100%)', glassBg: 'rgba(255, 255, 255, 0.4)', glassBorder: 'rgba(255, 255, 255, 0.7)', primary: '#047857', text: '#064e3b', cardBg: 'rgba(255, 255, 255, 0.55)', icon: '🌺' },
      { id: 'space', name: 'Космос', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%)', glassBg: 'rgba(15, 23, 42, 0.7)', glassBorder: 'rgba(56, 189, 248, 0.3)', primary: '#818cf8', text: '#f8fafc', cardBg: 'rgba(2, 6, 23, 0.75)', icon: '🚀' },
      { id: 'night_city', name: 'Ночной город', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #111827 0%, #1f2937 50%, #374151 100%)', glassBg: 'rgba(31, 41, 55, 0.65)', glassBorder: 'rgba(245, 158, 11, 0.3)', primary: '#f59e0b', text: '#f9fafb', cardBg: 'rgba(17, 24, 39, 0.7)', icon: '🏙️' },
      { id: 'ocean', name: 'Морская тема', category: 'Природа', bgGradient: 'linear-gradient(135deg, #0f766e 0%, #0e7490 50%, #0369a1 100%)', glassBg: 'rgba(255, 255, 255, 0.25)', glassBorder: 'rgba(255, 255, 255, 0.4)', primary: '#67e8f9', text: '#f0fdf4', cardBg: 'rgba(15, 118, 110, 0.5)', icon: '🌊' },
      { id: 'light_minimal', name: 'Светлый минимализм', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)', glassBg: 'rgba(255, 255, 255, 0.7)', glassBorder: 'rgba(203, 213, 225, 0.6)', primary: '#2563eb', text: '#0f172a', cardBg: 'rgba(255, 255, 255, 0.85)', icon: '☀️' },
      { id: 'gold_luxury', name: 'Графитово-золотая', category: 'Премиум', bgGradient: 'linear-gradient(135deg, #18181b 0%, #27272a 50%, #09090b 100%)', glassBg: 'rgba(39, 39, 42, 0.65)', glassBorder: 'rgba(234, 179, 8, 0.4)', primary: '#eab308', text: '#fafafa', cardBg: 'rgba(24, 24, 27, 0.75)', icon: '👑' },
      { id: 'summer', name: 'Лето', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #fde047 0%, #f97316 100%)', glassBg: 'rgba(255, 255, 255, 0.4)', glassBorder: 'rgba(255, 255, 255, 0.7)', primary: '#ea580c', text: '#431407', cardBg: 'rgba(255, 255, 255, 0.6)', icon: '☀️' }
    ];

    const INITIAL_STUDENTS = [
      {
        id: '1',
        name: 'Алина Захарова',
        language: 'English',
        totalLessons: 10,
        completedLessons: 8,
        startDate: '2026-10-12',
        endDate: '2026-11-12',
        price: 15000,
        duration: 60,
        notes: 'Подготовка к собеседованию',
        history: [{ id: 'h1', date: '2026-10-14 11:00', note: 'Разбор Грамматики' }]
      },
      {
        id: '2',
        name: 'Мухаммад Аль-Мансур',
        language: 'Arabic',
        totalLessons: 10,
        completedLessons: 5,
        startDate: '2026-10-01',
        endDate: '2026-11-01',
        price: 18000,
        duration: 90,
        notes: 'Диалект Египта',
        history: [{ id: 'h21', date: '2026-10-02 14:00', note: 'Алфавит' }]
      }
    ];

    function getProgressColor(percent) {
      if (percent <= 20) return '#22c55e';
      if (percent <= 40) return '#84cc16';
      if (percent <= 60) return '#eab308';
      if (percent <= 80) return '#f97316';
      if (percent < 100) return '#ef4444';
      return '#dc2626';
    }

    // --- DYNAMIC GREETING COMPONENT (MSK Time) ---
    function DynamicGreeting() {
      const getGreetingText = () => {
        const now = new Date();
        const mskHours = (now.getUTCHours() + 3) % 24;
        const mskMinutes = now.getUTCMinutes();
        const timeVal = mskHours * 100 + mskMinutes;

        // 06:00 - 11:00 MSK
        if (timeVal >= 600 && timeVal <= 1100) {
          return "Доброе утро, Дашуля ❤️";
        }
        // 11:01 - 21:00 MSK -> Changing friendly emoji on new entry/session
        else if (timeVal >= 1101 && timeVal <= 2100) {
          const emojis = ['😊', '🌟', '✨', '🌸', '☕', '🥰', '🎈', '💖', '🍀', '🍓'];
          const sessionKey = 'dashulya_random_emoji';
          let emoji = sessionStorage.getItem(sessionKey);
          if (!emoji) {
            emoji = emojis[Math.floor(Math.random() * emojis.length)];
            sessionStorage.setItem(sessionKey, emoji);
          }
          return `Добрый день, Дашуля ${emoji}`;
        }
        // 21:01 - 05:59 MSK -> Permanent crescent moon
        else {
          return "Доброй ночи, Дашуля 🌙";
        }
      };

      return (
        <div className="pt-6 pb-2 px-6 flex justify-center">
          <div className="px-6 py-3 rounded-full backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-3 bg-white/10 animate-fadeIn">
            <span className="text-lg md:text-xl font-medium tracking-wide">
              {getGreetingText()}
            </span>
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('dashulya_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [activeThemeId, setActiveThemeId] = useState(() => {
        return localStorage.getItem('dashulya_theme') || 'spring';
      });

      const [customBg, setCustomBg] = useState(() => {
        return localStorage.getItem('dashulya_custom_bg') || null;
      });

      const [bgBlur, setBgBlur] = useState(() => {
        return Number(localStorage.getItem('dashulya_bg_blur')) || 16;
      });

      const [bgDim, setBgDim] = useState(() => {
        return Number(localStorage.getItem('dashulya_bg_dim')) || 10;
      });

      const [borderRadius, setBorderRadius] = useState(() => {
        return Number(localStorage.getItem('dashulya_radius')) || 24;
      });

      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'settings'

      // Modals
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [lessonModalStudent, setLessonModalStudent] = useState(null);
      const [historyStudent, setHistoryStudent] = useState(null);
      const [isPwaModalOpen, setIsPwaModalOpen] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');

      // Persistence in localStorage
      useEffect(() => {
        localStorage.setItem('dashulya_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('dashulya_theme', activeThemeId);
      }, [activeThemeId]);

      useEffect(() => {
        if (customBg) {
          localStorage.setItem('dashulya_custom_bg', customBg);
        } else {
          localStorage.removeItem('dashulya_custom_bg');
        }
      }, [customBg]);

      useEffect(() => {
        localStorage.setItem('dashulya_bg_blur', bgBlur);
        localStorage.setItem('dashulya_bg_dim', bgDim);
        localStorage.setItem('dashulya_radius', borderRadius);
      }, [bgBlur, bgDim, borderRadius]);

      const currentTheme = useMemo(() => {
        return THEMES.find((t) => t.id === activeThemeId) || THEMES[0];
      }, [activeThemeId]);

      // Handlers
      const handleConfirmLesson = (studentId, date, note) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const completed = Math.min(s.totalLessons, s.completedLessons + 1);
              const newHistory = [
                { id: Date.now().toString(), date, note: note || 'Занятие проведено' },
                ...(s.history || [])
              ];
              return { ...s, completedLessons: completed, history: newHistory };
            }
            return s;
          })
        );
        setLessonModalStudent(null);
      };

      const handleRevertLesson = (studentId, historyId) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const updatedHistory = (s.history || []).filter((h) => h.id !== historyId);
              const completed = Math.max(0, s.completedLessons - 1);
              return { ...s, completedLessons: completed, history: updatedHistory };
            }
            return s;
          })
        );
      };

      const handleSaveStudent = (formData) => {
        if (editingStudent) {
          setStudents((prev) =>
            prev.map((s) => (s.id === editingStudent.id ? { ...s, ...formData } : s))
          );
        } else {
          const newStudent = {
            id: Date.now().toString(),
            ...formData,
            completedLessons: 0,
            history: []
          };
          setStudents((prev) => [newStudent, ...prev]);
        }
        setIsStudentModalOpen(false);
        setEditingStudent(null);
      };

      const handleDeleteStudent = (id) => {
        if (window.confirm('Удалить этого ученика?')) {
          setStudents((prev) => prev.filter((s) => s.id !== id));
          if (historyStudent?.id === id) setHistoryStudent(null);
        }
      };

      const filteredStudents = useMemo(() => {
        return students.filter((s) => {
          const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || (s.notes && s.notes.toLowerCase().includes(searchQuery.toLowerCase()));
          if (!matchesSearch) return false;

          const remaining = s.totalLessons - s.completedLessons;
          const isExpired = new Date(s.endDate) < new Date();

          if (statusFilter === 'active') return remaining > 0 && !isExpired;
          if (statusFilter === 'ending') return remaining > 0 && remaining <= 2;
          if (statusFilter === 'expired') return isExpired || remaining === 0;
          if (statusFilter === 'english') return s.language === 'English';
          if (statusFilter === 'arabic') return s.language === 'Arabic';
          return true;
        });
      }, [students, searchQuery, statusFilter]);

      const stats = useMemo(() => {
        const total = students.length;
        const active = students.filter((s) => s.totalLessons - s.completedLessons > 0 && new Date(s.endDate) >= new Date()).length;
        const ending = students.filter((s) => {
          const rem = s.totalLessons - s.completedLessons;
          return rem > 0 && rem <= 2;
        }).length;
        return { total, active, ending };
      }, [students]);

      return (
        <div
          className="relative min-h-screen transition-colors duration-500 font-sans text-slate-100 overflow-x-hidden selection:bg-pink-500/30 pb-24"
          style={{
            background: customBg ? 'none' : currentTheme.bgGradient,
            color: currentTheme.text
          }}
        >
          {customBg && (
            <div
              className="fixed inset-0 bg-cover bg-center z-0"
              style={{ backgroundImage: `url(${customBg})`, filter: `blur(${bgBlur}px)` }}
            />
          )}

          <div
            className="fixed inset-0 pointer-events-none z-0"
            style={{ backgroundColor: '#000', opacity: bgDim / 100 }}
          />

          <div className="relative z-10 flex flex-col max-w-xl mx-auto min-h-screen">
            <DynamicGreeting />

            <main className="flex-1 px-4 pt-2">
              {activeTab === 'main' ? (
                <div className="space-y-5">
                  <div className="flex justify-between items-center">
                    <div>
                      <h1 className="text-2xl font-bold">Ученики Дашули</h1>
                      <p className="text-xs opacity-75">{new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => setIsPwaModalOpen(true)}
                        className="p-2.5 rounded-2xl bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-xs flex items-center gap-1.5"
                      >
                        <Download className="w-4 h-4" />
                        <span className="hidden sm:inline">PWA</span>
                      </button>

                      <button
                        onClick={() => { setEditingStudent(null); setIsStudentModalOpen(true); }}
                        style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.primary }}
                        className="px-4 py-2.5 text-white font-medium shadow-lg hover:opacity-90 flex items-center gap-2 text-xs"
                      >
                        <Plus className="w-4 h-4" />
                        <span>Добавить</span>
                      </button>
                    </div>
                  </div>

                  {/* Stats */}
                  <div className="grid grid-cols-3 gap-3">
                    <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="p-3 border shadow-lg">
                      <div className="text-xs opacity-75">Всего</div>
                      <div className="text-xl font-bold">{stats.total}</div>
                    </div>
                    <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="p-3 border shadow-lg">
                      <div className="text-xs opacity-75 text-emerald-400">Активных</div>
                      <div className="text-xl font-bold text-emerald-400">{stats.active}</div>
                    </div>
                    <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="p-3 border shadow-lg">
                      <div className="text-xs opacity-75 text-amber-400">Мало уроков</div>
                      <div className="text-xl font-bold text-amber-400">{stats.ending}</div>
                    </div>
                  </div>

                  {/* Search & Filters */}
                  <div className="space-y-2">
                    <div className="relative">
                      <Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 opacity-50" />
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Поиск ученика..."
                        style={{ borderRadius: `${borderRadius}px` }}
                        className="w-full pl-10 pr-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 text-xs focus:outline-none placeholder:text-white/40"
                      />
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                      {[
                        { id: 'all', label: 'Все' },
                        { id: 'active', label: 'Активные' },
                        { id: 'ending', label: 'Заканчиваются' },
                        { id: 'english', label: '🇬🇧 English' },
                        { id: 'arabic', label: '🇸🇦 Arabic' }
                      ].map((f) => (
                        <button
                          key={f.id}
                          onClick={() => setStatusFilter(f.id)}
                          style={{ borderRadius: `${borderRadius}px`, backgroundColor: statusFilter === f.id ? currentTheme.primary : 'rgba(255,255,255,0.1)' }}
                          className={`px-3 py-1.5 whitespace-nowrap border border-white/10 ${statusFilter === f.id ? 'font-medium' : 'opacity-70'}`}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Students List */}
                  <div className="space-y-3">
                    {filteredStudents.length === 0 ? (
                      <div className="p-8 text-center opacity-60 text-xs">Ученики не найдены</div>
                    ) : (
                      filteredStudents.map((student) => {
                        const percent = Math.min(100, Math.round((student.completedLessons / (student.totalLessons || 1)) * 100));
                        const remaining = Math.max(0, student.totalLessons - student.completedLessons);
                        const progressColor = getProgressColor(percent);

                        return (
                          <div
                            key={student.id}
                            style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }}
                            className="p-4 border shadow-lg space-y-3"
                          >
                            <div className="flex justify-between items-start">
                              <div>
                                <div className="flex items-center gap-2">
                                  <h3 className="font-bold text-base">{student.name}</h3>
                                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/10 border border-white/20">
                                    {student.language === 'English' ? '🇬🇧 EN' : '🇸🇦 AR'}
                                  </span>
                                </div>
                                <p className="text-xs opacity-60 mt-0.5">До {student.endDate}</p>
                              </div>

                              <div className="flex gap-1">
                                <button onClick={() => { setEditingStudent(student); setIsStudentModalOpen(true); }} className="p-1.5 rounded-xl bg-white/10 hover:bg-white/20">
                                  <Edit3 className="w-3.5 h-3.5" />
                                </button>
                                <button onClick={() => setHistoryStudent(student)} className="p-1.5 rounded-xl bg-white/10 hover:bg-white/20">
                                  <History className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            </div>

                            <div className="space-y-1">
                              <div className="flex justify-between text-xs">
                                <span>Проведено: {student.completedLessons} из {student.totalLessons}</span>
                                <span>Осталось: {remaining}</span>
                              </div>
                              <div className="w-full h-2.5 bg-black/20 rounded-full overflow-hidden p-0.5 border border-white/10">
                                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${percent}%`, backgroundColor: progressColor }} />
                              </div>
                            </div>

                            <button
                              onClick={() => setLessonModalStudent(student)}
                              disabled={remaining <= 0}
                              style={{ borderRadius: `${borderRadius - 6}px`, backgroundColor: remaining > 0 ? currentTheme.primary : 'rgba(255,255,255,0.1)' }}
                              className="w-full py-2 text-xs font-medium text-white shadow-md flex items-center justify-center gap-1"
                            >
                              <CheckCircle2 className="w-3.5 h-3.5" />
                              <span>+ Провести урок</span>
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              ) : (
                <div className="space-y-5">
                  <h1 className="text-2xl font-bold">Настройки оформления</h1>

                  {/* Themes */}
                  <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="p-4 border shadow-xl space-y-3">
                    <h2 className="font-bold text-sm flex items-center gap-2"><Sparkles className="w-4 h-4 text-amber-400" /> Выберите тему (17 пресетов)</h2>
                    <div className="grid grid-cols-2 gap-2">
                      {THEMES.map((t) => (
                        <button
                          key={t.id}
                          onClick={() => setActiveThemeId(t.id)}
                          style={{ borderRadius: `${borderRadius - 4}px`, background: t.bgGradient }}
                          className={`p-2.5 text-left border ${activeThemeId === t.id ? 'ring-2 ring-white border-white' : 'border-white/20 opacity-80'}`}
                        >
                          <div className="text-sm">{t.icon} <span className="font-semibold text-white text-xs">{t.name}</span></div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Background Photo */}
                  <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="p-4 border shadow-xl space-y-3">
                    <h2 className="font-bold text-sm flex items-center gap-2"><ImageIcon className="w-4 h-4 text-sky-400" /> Свой фон</h2>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onloadend = () => setCustomBg(reader.result);
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="text-xs w-full file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-white/20 file:text-white hover:file:bg-white/30 cursor-pointer"
                    />
                    {customBg && (
                      <button onClick={() => setCustomBg(null)} className="px-3 py-1.5 text-xs text-red-400 border border-red-500/30 rounded-xl bg-red-500/10">
                        Сбросить фон
                      </button>
                    )}
                  </div>
                </div>
              )}
            </main>

            {/* Bottom Nav */}
            <nav
              className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-[90%] max-w-sm"
              style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.glassBg, backdropFilter: `blur(${bgBlur}px)`, borderColor: currentTheme.glassBorder, borderWidth: '1px' }}
            >
              <div className="flex justify-around py-2">
                <button
                  onClick={() => setActiveTab('main')}
                  style={{ backgroundColor: activeTab === 'main' ? currentTheme.primary : 'transparent', color: activeTab === 'main' ? '#fff' : currentTheme.text, borderRadius: `${borderRadius - 6}px` }}
                  className="flex items-center gap-1 px-5 py-1.5 text-xs font-medium transition-all"
                >
                  <Home className="w-4 h-4" /> Главная
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  style={{ backgroundColor: activeTab === 'settings' ? currentTheme.primary : 'transparent', color: activeTab === 'settings' ? '#fff' : currentTheme.text, borderRadius: `${borderRadius - 6}px` }}
                  className="flex items-center gap-1 px-5 py-1.5 text-xs font-medium transition-all"
                >
                  <SettingsIcon className="w-4 h-4" /> Настройки
                </button>
              </div>
            </nav>
          </div>

          {/* Student Form Modal */}
          {isStudentModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-md border p-5 space-y-3 text-xs shadow-2xl">
                <div className="flex justify-between font-bold text-sm">
                  <span>{editingStudent ? 'Редактировать' : 'Новый ученик'}</span>
                  <button onClick={() => setIsStudentModalOpen(false)}><X className="w-4 h-4" /></button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleSaveStudent({
                    name: form.name.value,
                    language: form.language.value,
                    totalLessons: Number(form.totalLessons.value),
                    startDate: form.startDate.value,
                    endDate: form.endDate.value,
                    notes: form.notes.value
                  });
                }} className="space-y-3">
                  <div>
                    <label className="opacity-80">Имя ученика</label>
                    <input name="name" defaultValue={editingStudent?.name} required className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="opacity-80">Язык</label>
                      <select name="language" defaultValue={editingStudent?.language || 'English'} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1 text-black">
                        <option value="English">English</option>
                        <option value="Arabic">Arabic</option>
                      </select>
                    </div>
                    <div>
                      <label className="opacity-80">Всего уроков</label>
                      <input type="number" name="totalLessons" defaultValue={editingStudent?.totalLessons || 10} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="opacity-80">Дата начала</label>
                      <input type="date" name="startDate" defaultValue={editingStudent?.startDate || new Date().toISOString().slice(0, 10)} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1" />
                    </div>
                    <div>
                      <label className="opacity-80">Дата окончания</label>
                      <input type="date" name="endDate" defaultValue={editingStudent?.endDate || new Date(Date.now() + 30*86400000).toISOString().slice(0, 10)} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1" />
                    </div>
                  </div>
                  <div>
                    <label className="opacity-80">Заметки</label>
                    <textarea name="notes" defaultValue={editingStudent?.notes} className="w-full p-2 bg-white/10 rounded-xl border border-white/20 mt-1" rows="2" />
                  </div>
                  <button type="submit" style={{ backgroundColor: currentTheme.primary, borderRadius: `${borderRadius - 6}px` }} className="w-full py-2.5 text-white font-medium shadow-md">
                    Сохранить
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Lesson Confirmation Modal */}
          {lessonModalStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-xs border p-4 space-y-3 text-xs shadow-2xl">
                <div className="font-bold">Провести урок</div>
                <p>Списать 1 урок для {lessonModalStudent.name}?</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setLessonModalStudent(null)} className="flex-1 py-2 bg-white/10 rounded-xl">Отмена</button>
                  <button onClick={() => handleConfirmLesson(lessonModalStudent.id, new Date().toLocaleString(), 'Занятие проведено')} style={{ backgroundColor: currentTheme.primary }} className="flex-1 py-2 text-white rounded-xl">Да</button>
                </div>
              </div>
            </div>
          )}

          {/* History Modal */}
          {historyStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
              <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-md border p-4 space-y-3 text-xs shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex justify-between font-bold">
                  <span>История: {historyStudent.name}</span>
                  <button onClick={() => setHistoryStudent(null)}><X className="w-4 h-4" /></button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2">
                  {!historyStudent.history || historyStudent.history.length === 0 ? (
                    <div className="opacity-50 text-center py-4">История пуста</div>
                  ) : (
                    historyStudent.history.map((h) => (
                      <div key={h.id} className="p-2.5 bg-white/5 border border-white/10 rounded-xl flex justify-between items-center">
                        <div>
                          <div className="font-semibold text-pink-300">{h.date}</div>
                          <div>{h.note}</div>
                        </div>
                        <button onClick={() => handleRevertLesson(historyStudent.id, h.id)} className="text-red-400 p-1"><RotateCcw className="w-3.5 h-3.5" /></button>
                      </div>
                    ))
                  )}
                </div>
                <button onClick={() => handleDeleteStudent(historyStudent.id)} className="w-full py-2 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl">
                  Удалить ученика
                </button>
              </div>
            </div>
          )}

          {/* PWA Modal */}
          {isPwaModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">
              <div style={{ borderRadius: `${borderRadius}px`, backgroundColor: currentTheme.cardBg, borderColor: currentTheme.glassBorder }} className="w-full max-w-sm border p-5 space-y-3 text-xs shadow-2xl">
                <div className="flex justify-between font-bold text-sm">
                  <span>Установка на iPhone / iPad</span>
                  <button onClick={() => setIsPwaModalOpen(false)}><X className="w-4 h-4" /></button>
                </div>
                <ol className="list-decimal list-inside space-y-1.5 opacity-90 bg-white/5 p-3 rounded-xl border border-white/10">
                  <li>Откройте сайт в <strong>Safari</strong>.</li>
                  <li>Нажмите кнопку <strong>«Поделиться»</strong> (стрелочка вверх).</li>
                  <li>Выберите <strong>«На экран "Домой"»</strong>.</li>
                </ol>
                <button onClick={() => setIsPwaModalOpen(false)} style={{ backgroundColor: currentTheme.primary, borderRadius: `${borderRadius - 6}px` }} className="w-full py-2 text-white font-medium">
                  Понятно
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
