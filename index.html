    // ==========================================
    // 2. HELPER UTILS & CALCULATIONS
    // ==========================================
    function getProgressColor(percent) {
      if (percent <= 20) return '#22c55e'; // Green
      if (percent <= 40) return '#84cc16'; // Light Green
      if (percent <= 60) return '#eab308'; // Yellow
      if (percent <= 80) return '#f97316'; // Orange
      if (percent < 100) return '#ef4444'; // Red-orange
      return '#dc2626'; // Pure Red
    }

    function getStudentStatus(student) {
      const remaining = student.totalLessons - student.completedLessons;
      const now = new Date();
      const endDate = new Date(student.endDate);
      
      if (remaining <= 0) return { label: 'Занятия закончились', color: 'bg-red-500/20 text-red-500 border-red-500/30' };
      if (endDate < now) return { label: 'Срок действия истёк', color: 'bg-red-500/20 text-red-400 border-red-500/30' };
      if (remaining === 1) return { label: 'Осталось 1 занятие!', color: 'bg-orange-500/20 text-orange-400 border-orange-500/30' };
      
      const diffTime = endDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays <= 3) return { label: 'Срок скоро истекает', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };
      if (remaining <= 2) return { label: 'Мало занятий', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' };

      return { label: 'Активен', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' };
    }

      const [historyStudent, setHistoryStudent] = useState(null);

      useEffect(() => {

      }, [bgBlur, bgDim, borderRadius, deviceMode, animationsEnabled]);

      const currentTheme = useMemo(() => {
        return THEMES.find((t) => t.id === activeThemeId) || THEMES[0];
      }, [activeThemeId]);

      const handleConfirmLesson = (studentId, date, note) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const completed = Math.min(s.totalLessons, s.completedLessons + 1);
              const newHistory = [
                { id: Date.now().toString(), date, note: note || 'Занятие проведено' },
                ...(s.history || [])
              ];
              return { ...s, completedLessons: completed, history: newHistory };
            }
            return s;
          })
        );
        setLessonModalStudent(null);
      };

      const handleRevertLesson = (studentId, historyItemId) => {
        setStudents((prev) =>
          prev.map((s) => {
            if (s.id === studentId) {
              const updatedHistory = (s.history || []).filter((h) => h.id !== historyItemId);
              const completed = Math.max(0, s.completedLessons - 1);
              return { ...s, completedLessons: completed, history: updatedHistory };
            }
            return s;
          })
        );
      };

      const handleSaveStudent = (formData) => {
        if (editingStudent) {
          setStudents((prev) =>
            prev.map((s) => (s.id === editingStudent.id ? { ...s, ...formData } : s))
          );
        } else {
          const newStudent = {
            id: Date.now().toString(),
            ...formData,
            completedLessons: 0,
            history: []
          };
          setStudents((prev) => [newStudent, ...prev]);
        }
        setIsStudentModalOpen(false);
        setEditingStudent(null);
      };

      const handleDeleteStudent = (id) => {
        if (window.confirm('Вы уверены, что хотите удалить этого ученика?')) {
          setStudents((prev) => prev.filter((s) => s.id !== id));
          if (historyStudent?.id === id) setHistoryStudent(null);
        }
      };

      const filteredStudents = useMemo(() => {
        return students.filter((s) => {
          const matchesSearch =
            s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.notes.toLowerCase().includes(searchQuery.toLowerCase());

          if (!matchesSearch) return false;

          const remaining = s.totalLessons - s.completedLessons;
          const isExpired = new Date(s.endDate) < new Date();

          if (statusFilter === 'active') return remaining > 0 && !isExpired;
          if (statusFilter === 'ending') return remaining > 0 && remaining <= 2;
          if (statusFilter === 'expired') return isExpired || remaining === 0;
          if (statusFilter === 'english') return s.language === 'English';
          if (statusFilter === 'arabic') return s.language === 'Arabic';

          return true;
        });
      }, [students, searchQuery, statusFilter]);

      const stats = useMemo(() => {
        const total = students.length;
        const active = students.filter(
          (s) => s.totalLessons - s.completedLessons > 0 && new Date(s.endDate) >= new Date()
        ).length;
        const ending = students.filter((s) => {
          const rem = s.totalLessons - s.completedLessons;
          return rem > 0 && rem <= 2;
        }).length;

        return { total, active, ending };
      }, [students]);

    // ==========================================
    // 4. MORNING GREETING COMPONENT
    // ==========================================
    function MorningGreeting({ animationsEnabled }) {
      const [visible, setVisible] = useState(false);
      const [fadingOut, setFadingOut] = useState(false);

      useEffect(() => {
        const checkGreeting = () => {
          const now = new Date();
          const hours = now.getHours();
          
          if (hours >= 6 && hours < 10) {
            const todayStr = now.toDateString();
            const lastShown = localStorage.getItem('dashulya_greeting_shown_date');

            if (lastShown !== todayStr) {
              setVisible(true);
              localStorage.setItem('dashulya_greeting_shown_date', todayStr);

              const fadeTimer = setTimeout(() => {
                setFadingOut(true);
                const removeTimer = setTimeout(() => {
                  setVisible(false);
                  setFadingOut(false);
                }, 1800);
                return () => clearTimeout(removeTimer);
              }, 10000);

              return () => clearTimeout(fadeTimer);
            }
          }
        };

        checkGreeting();
      }, []);

      if (!visible) return null;

      return (
        <div
          className={`pt-6 pb-2 px-6 flex justify-center transition-all duration-1000 transform ${
            fadingOut ? 'opacity-0 -translate-y-4' : 'opacity-100 translate-y-0'
          }`}
        >
          <div className="glass-panel px-6 py-3 rounded-full backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-3 bg-white/10">
            <span className="text-xl md:text-2xl font-medium tracking-wide">
              Доброе утро, Дашуля
            </span>
            <span
              className={`inline-block text-xl text-pink-400 ${
                animationsEnabled ? 'animate-bounce' : ''
              }`}
            >
              ❤️
            </span>
          </div>
        </div>
      );
    }

      const percent = Math.min(
        100,

      const progressColor = getProgressColor(percent);

      return (
        <div

            borderRadius: `${borderRadius}px`,

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 5 * 1024 * 1024) {
            alert('Файл слишком большой. Выберите фото до 5 МБ.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setCustomBg(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleExportData = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(students, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `dashulya_tutor_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (Array.isArray(imported)) {
                setStudents(imported);
                alert('Данные успешно импортированы!');
              } else {
                alert('Неверный формат файла данных.');

              alert('Ошибка при чтении файла JSON.');

          reader.readAsText(file);

            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
              {[
                { id: 'auto', label: 'Авто', icon: Monitor },
                { id: 'iphone', label: 'iPhone 15 Pro', icon: Smartphone },
                { id: 'ipad', label: 'iPad Air 11″', icon: Tablet },
                { id: 'desktop', label: 'Компьютер', icon: Monitor }
              ].map((dev) => {
                const Icon = dev.icon;
                const isSel = deviceMode === dev.id;
                return (
                  <button
                    key={dev.id}
                    onClick={() => setDeviceMode(dev.id)}
                    style={{
                      borderRadius: `${borderRadius - 6}px`,
                      backgroundColor: isSel ? currentTheme.primary : 'rgba(255,255,255,0.1)'
                    }}
                    className="p-3 flex flex-col items-center justify-center gap-1.5 text-xs transition-all border border-white/10"
                  >
                    <Icon className="w-5 h-5" />
                    <span>{dev.label}</span>
                  </button>
                );
              })}
            </div>

            <div className="pt-2">
              <div className="flex justify-between text-xs mb-1">
                <span>Скругление карточек Liquid Glass</span>
                <span>{borderRadius}px</span>
              </div>
              <input
                type="range"
                min="8"
                max="36"
                value={borderRadius}
                onChange={(e) => setBorderRadius(Number(e.target.value))}
                className="w-full accent-pink-500 cursor-pointer"
              />
            </div>

            <div className="flex items-center justify-between pt-2 border-t border-white/10">
              <div>
                <div className="text-sm font-medium">Анимации интерфейса</div>
                <div className="text-xs opacity-60">Плавные переходы и эффекты</div>
              </div>
              <input
                type="checkbox"
                checked={animationsEnabled}
                onChange={(e) => setAnimationsEnabled(e.target.checked)}
                className="w-5 h-5 accent-pink-500 rounded cursor-pointer"
              />
            </div>
          </div>

          <div
            style={{
              borderRadius: `${borderRadius}px`,
              backgroundColor: currentTheme.cardBg,
              borderColor: currentTheme.glassBorder
            }}
            className="p-4 md:p-6 border backdrop-blur-md shadow-xl space-y-4"
          >
            <div className="flex items-center gap-2 font-bold text-base">
              <Database className="w-5 h-5 text-indigo-400" />
              <h2>Управление данными и Установка PWA</h2>
            </div>

            <div className="flex flex-wrap gap-3">
              <button
                onClick={onOpenPwaGuide}
                style={{ borderRadius: `${borderRadius - 6}px`, backgroundColor: currentTheme.primary }}
                className="px-4 py-2 text-xs font-medium text-white shadow-md flex items-center gap-2"
              >
                <Download className="w-4 h-4" />
                <span>Инструкция установки PWA на iPhone/iPad</span>
              </button>

              <button
                onClick={handleExportData}
                style={{ borderRadius: `${borderRadius - 6}px` }}
                className="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium transition-all flex items-center gap-2"
              >
                <Download className="w-4 h-4" />
                <span>Экспорт бэкапа (JSON)</span>
              </button>

              <label
                style={{ borderRadius: `${borderRadius - 6}px` }}
                className="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-medium cursor-pointer transition-all flex items-center gap-2"
              >
                <Upload className="w-4 h-4" />
                <span>Импорт бэкапа</span>
                <input type="file" onChange={handleImportData} accept=".json" className="hidden" />
              </label>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. BOTTOM NAVIGATION BAR
    // ==========================================
    function BottomNavigation({ activeTab, setActiveTab, currentTheme, borderRadius, bgBlur }) {
      return (
        <nav
          className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-md transition-all duration-300"
          style={{
            borderRadius: `${borderRadius}px`,
            backgroundColor: currentTheme.glassBg,
            backdropFilter: `blur(${bgBlur}px)`,
            borderColor: currentTheme.glassBorder,
            borderWidth: '1px'
          }}
        >
          <div className="flex items-center justify-around py-2 px-3">
            <button
              onClick={() => setActiveTab('main')}
              className={`flex flex-col items-center gap-1 px-5 py-1.5 rounded-2xl transition-all duration-300 ${
                activeTab === 'main' ? 'scale-105' : 'opacity-60 hover:opacity-100'
              }`}
              style={{
                backgroundColor: activeTab === 'main' ? currentTheme.primary : 'transparent',
                color: activeTab === 'main' ? '#ffffff' : currentTheme.text
              }}
            >
              <Home className="w-5 h-5" />
              <span className="text-[11px] font-medium">Главная</span>
            </button>

            <button
              onClick={() => setActiveTab('settings')}
              className={`flex flex-col items-center gap-1 px-5 py-1.5 rounded-2xl transition-all duration-300 ${
                activeTab === 'settings' ? 'scale-105' : 'opacity-60 hover:opacity-100'
              }`}
              style={{
                backgroundColor: activeTab === 'settings' ? currentTheme.primary : 'transparent',
                color: activeTab === 'settings' ? '#ffffff' : currentTheme.text
              }}
            >
              <SettingsIcon className="w-5 h-5" />
              <span className="text-[11px] font-medium">Настройки</span>
            </button>
          </div>
        </nav>
      );
    }

    // ==========================================
    // 9. MODALS
    // ==========================================
    function StudentFormModal({ student, onClose, onSave, currentTheme, borderRadius }) {
      const [formData, setFormData] = useState({
        name: student?.name || '',
        language: student?.language || 'English',
        totalLessons: student?.totalLessons || 10,
        startDate: student?.startDate || new Date().toISOString().slice(0, 10),
        endDate: student?.endDate || new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10),
        price: student?.price || 15000,
        duration: student?.duration || 60,
        notes: student?.notes || ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          alert('Заполните имя ученика');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div
            style={{
              borderRadius: `${borderRadius}px`,
              backgroundColor: currentTheme.cardBg,
              borderColor: currentTheme.glassBorder
            }}
            className="w-full max-w-lg border p-6 backdrop-blur-xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto"
          >
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <h2 className="text-lg font-bold">
                {student ? 'Редактировать ученика' : 'Новый ученик и абонемент'}
              </h2>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10">
                <X className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block mb-1 opacity-80">ФИО Ученика *</label>
                <input
                  type="text"
                  required
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  placeholder="Например: Алина Захарова"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Изучаемый язык</label>
                  <select
                    value={formData.language}
                    onChange={(e) => setFormData({ ...formData, language: e.target.value })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none text-slate-800"
                  >
                    <option value="English">🇬🇧 English</option>
                    <option value="Arabic">🇸🇦 Arabic</option>
                  </select>
                </div>

                <div>
                  <label className="block mb-1 opacity-80">Кол-во занятий</label>
                  <input
                    type="number"
                    min="1"
                    value={formData.totalLessons}
                    onChange={(e) => setFormData({ ...formData, totalLessons: Number(e.target.value) })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Дата начала</label>
                  <input
                    type="date"
                    value={formData.startDate}
                    onChange={(e) => setFormData({ ...formData, startDate: e.target.value })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block mb-1 opacity-80">Дата окончания</label>
                  <input
                    type="date"
                    value={formData.endDate}
                    onChange={(e) => setFormData({ ...formData, endDate: e.target.value })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block mb-1 opacity-80">Стоимость (руб)</label>
                  <input
                    type="number"
                    value={formData.price}
                    onChange={(e) => setFormData({ ...formData, price: Number(e.target.value) })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block mb-1 opacity-80">Длительность (мин)</label>
                  <input
                    type="number"
                    value={formData.duration}
                    onChange={(e) => setFormData({ ...formData, duration: Number(e.target.value) })}
                    className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block mb-1 opacity-80">Примечание / Цель обучения</label>
                <textarea
                  rows="3"
                  value={formData.notes}
                  onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                  className="w-full p-2.5 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                  placeholder="Уровень, пожелания, программа..."
                />
              </div>

              <div className="flex gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 bg-white/10 rounded-xl hover:bg-white/20 font-medium"
                >
                  Отмена
                </button>
                <button
                  type="submit"
                  style={{ backgroundColor: currentTheme.primary }}
                  className="flex-1 py-2.5 text-white rounded-xl font-medium shadow-lg hover:opacity-90"
                >
                  Сохранить
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function LessonConfirmationModal({ student, onClose, onConfirm, currentTheme, borderRadius }) {
      const [date, setDate] = useState(new Date().toISOString().slice(0, 16).replace('T', ' '));
      const [note, setNote] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div
            style={{
              borderRadius: `${borderRadius}px`,
              backgroundColor: currentTheme.cardBg,
              borderColor: currentTheme.glassBorder
            }}
            className="w-full max-w-sm border p-5 backdrop-blur-xl shadow-2xl space-y-4"
          >
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-base">Отметка о проведенном уроке</h3>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10">
                <X className="w-4 h-4" />
              </button>
            </div>

            <p className="text-xs opacity-80">
              Списать 1 занятие для ученика <strong>{student.name}</strong>?
            </p>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block mb-1 opacity-80">Дата и время проведения</label>
                <input
                  type="text"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full p-2 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                />
              </div>

              <div>
                <label className="block mb-1 opacity-80">Тема урока / Заметка</label>
                <input
                  type="text"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="Например: Грамматика Unit 4"
                  className="w-full p-2 bg-white/10 rounded-xl border border-white/20 focus:outline-none"
                />
              </div>
            </div>

            <div className="flex gap-2 pt-2">
              <button
                onClick={onClose}
                className="flex-1 py-2 bg-white/10 rounded-xl text-xs font-medium"
              >
                Отмена
              </button>
              <button
                onClick={() => onConfirm(date, note)}
                style={{ backgroundColor: currentTheme.primary }}
                className="flex-1 py-2 text-white rounded-xl text-xs font-medium shadow-md"
              >
                Подтвердить
              </button>
            </div>
          </div>
        </div>
      );
    }

    function StudentHistoryModal({ student, onClose, onRevertLesson, onDeleteStudent, currentTheme, borderRadius }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div
            style={{
              borderRadius: `${borderRadius}px`,
              backgroundColor: currentTheme.cardBg,
              borderColor: currentTheme.glassBorder
            }}
            className="w-full max-w-md border p-5 backdrop-blur-xl shadow-2xl space-y-4 max-h-[85vh] flex flex-col"
          >
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <div>
                <h3 className="font-bold text-base">{student.name}</h3>
                <p className="text-xs opacity-60">История всех занятий</p>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10">
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
              {!student.history || student.history.length === 0 ? (
                <div className="p-6 text-center opacity-50">Занятия еще не проводились</div>
              ) : (
                student.history.map((h) => (
                  <div
                    key={h.id}
                    className="p-3 bg-white/5 border border-white/10 rounded-xl flex justify-between items-center gap-2"
                  >
                    <div>
                      <div className="font-medium text-pink-300">{h.date}</div>
                      <div className="opacity-80 mt-0.5">{h.note}</div>
                    </div>

                    <button
                      onClick={() => onRevertLesson(h.id)}
                      className="p-1.5 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-all"
                      title="Отменить это занятие"
                    >
                      <RotateCcw className="w-3.5 h-3.5" />
                    </button>
                  </div>
                ))
              )}
            </div>

            <div className="pt-2 border-t border-white/10 flex justify-between items-center">
              <button
                onClick={onDeleteStudent}
                className="px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs hover:bg-red-500/30 transition-all flex items-center gap-1"
              >
                <Trash2 className="w-3.5 h-3.5" />
                <span>Удалить ученика</span>
              </button>

              <button
                onClick={onClose}
                className="px-4 py-1.5 bg-white/10 rounded-xl text-xs font-medium hover:bg-white/20"
              >
                Закрыть
              </button>
            </div>
          </div>
        </div>
      );
    }

    function PwaInstallModal({ onClose, currentTheme, borderRadius }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div
            style={{
              borderRadius: `${borderRadius}px`,
              backgroundColor: currentTheme.cardBg,
              borderColor: currentTheme.glassBorder
            }}
            className="w-full max-w-md border p-6 backdrop-blur-xl shadow-2xl space-y-4"
          >
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <div className="flex items-center gap-2">
                <Smartphone className="w-5 h-5 text-pink-400" />
                <h3 className="font-bold text-base">Установка на экран Домой</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10">
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-3 text-xs leading-relaxed opacity-90">
              <p className="font-semibold text-sm">Инструкция для iOS (Safari на iPhone / iPad):</p>
              <ol className="list-decimal list-inside space-y-2 bg-white/5 p-3 rounded-xl border border-white/10">
                <li>Откройте сайт приложения в браузере <strong>Safari</strong>.</li>
                <li>
                  Нажмите нижнюю системную кнопку <strong>«Поделиться»</strong> (иконка со стрелкой вверх <Share2 className="w-3.5 h-3.5 inline" />).
                </li>
                <li>Прокрутите вниз и выберите <strong>«На экран "Домой"»</strong> (Add to Home Screen).</li>
                <li>Нажмите <strong>«Добавить»</strong> в правом верхнем углу.</li>
              </ol>
              <p className="text-[11px] opacity-70">
               
              </p>
            </div>

            <button
              onClick={onClose}
              style={{ backgroundColor: currentTheme.primary, borderRadius: `${borderRadius - 6}px` }}
              className="w-full py-2.5 text-white text-xs font-semibold shadow-md"
            >
              Понятно
            </button>
          </div>
        </div>
      );
    }

    // Рендер приложения
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
