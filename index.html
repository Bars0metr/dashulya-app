<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Дашуля Tutor App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel (для сборки JSX в браузере) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Отключение выделения текста и скроллбара */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-pink-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- ИКОНКИ (Эмуляция Lucide для браузера) ---
    const Icon = ({ name, className = "w-4 h-4", style }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} className={className} style={style}></i>;
    };

    const BookOpen = (p) => <Icon name="book-open" {...p} />;
    const Calendar = (p) => <Icon name="calendar" {...p} />;
    const CheckCircle2 = (p) => <Icon name="check-circle-2" {...p} />;
    const Clock = (p) => <Icon name="clock" {...p} />;
    const Plus = (p) => <Icon name="plus" {...p} />;
    const Search = (p) => <Icon name="search" {...p} />;
    const SettingsIcon = (p) => <Icon name="settings" {...p} />;
    const Home = (p) => <Icon name="home" {...p} />;
    const User = (p) => <Icon name="user" {...p} />;
    const AlertTriangle = (p) => <Icon name="alert-triangle" {...p} />;
    const Sparkles = (p) => <Icon name="sparkles" {...p} />;
    const ImageIcon = (p) => <Icon name="image" {...p} />;
    const RotateCcw = (p) => <Icon name="rotate-ccw" {...p} />;
    const Trash2 = (p) => <Icon name="trash-2" {...p} />;
    const Edit3 = (p) => <Icon name="edit-3" {...p} />;
    const X = (p) => <Icon name="x" {...p} />;
    const Upload = (p) => <Icon name="upload" {...p} />;
    const Check = (p) => <Icon name="check" {...p} />;
    const Smartphone = (p) => <Icon name="smartphone" {...p} />;
    const Tablet = (p) => <Icon name="tablet" {...p} />;
    const Monitor = (p) => <Icon name="monitor" {...p} />;
    const Download = (p) => <Icon name="download" {...p} />;
    const Share2 = (p) => <Icon name="share-2" {...p} />;
    const History = (p) => <Icon name="history" {...p} />;
    const Database = (p) => <Icon name="database" {...p} />;
    const Sliders = (p) => <Icon name="sliders" {...p} />;

    // --- ДАННЫЕ ТЕМ И ДЕМО-УЧЕНИКОВ ---
    const THEMES = [
      { id: 'spring', name: 'Spring Blossom', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', glassBg: 'rgba(255, 255, 255, 0.45)', glassBorder: 'rgba(255, 255, 255, 0.6)', primary: '#ec4899', text: '#1f2937', cardBg: 'rgba(255, 255, 255, 0.55)', icon: '🌸' },
      { id: 'midnight', name: 'Midnight Glass', category: 'Минимализм', bgGradient: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)', glassBg: 'rgba(30, 41, 59, 0.65)', glassBorder: 'rgba(255, 255, 255, 0.12)', primary: '#38bdf8', text: '#f8fafc', cardBg: 'rgba(15, 23, 42, 0.6)', icon: '🌙' },
      { id: 'autumn', name: 'Autumn Amber', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #451a03 0%, #78350f 50%, #b45309 100%)', glassBg: 'rgba(120, 53, 15, 0.45)', glassBorder: 'rgba(251, 191, 36, 0.3)', primary: '#f59e0b', text: '#fef3c7', cardBg: 'rgba(69, 26, 3, 0.55)', icon: '🍂' },
      { id: 'winter', name: 'Winter Frost', category: 'Сезонные', bgGradient: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%)', glassBg: 'rgba(255, 255, 255, 0.6)', glassBorder: 'rgba(255, 255, 255, 0.8)', primary: '#0284c7', text: '#0f172a', cardBg: 'rgba(255, 255, 255, 0.7)', icon: '❄️' },
      { id: 'halloween', name: 'Halloween Night', category: 'Праздники', bgGradient: 'linear-gradient(135deg, #180828 0%, #2e0854 50%, #581c87 100%)', glassBg: 'rgba(88, 28, 135, 0.4)', glassBorder: 'rgba(249, 115, 22, 0.4)', primary: '#f97316', text: '#faf5ff', cardBg: 'rgba(24, 8, 40, 0.65)', icon: '🎃' }
    ];

    const INITIAL_STUDENTS = [
      { id: '1', name: 'Алина Захарова', language: 'English', totalLessons: 10, completedLessons: 8, startDate: '2026-10-12', endDate: '2026-11-12', notes: 'Подготовка к разговорному экзамену', history: [{ id: 'h1', date: '2026-10-14 11:00', note: 'Разбор Грамматики' }] },
      { id: '2', name: 'Мухаммад Аль-Мансур', language: 'Arabic', totalLessons: 10, completedLessons: 5, startDate: '2026-10-01', endDate: '2026-11-01', notes: 'Египетский диалект', history: [] }
    ];

    // --- ПРИВЕТСТВИЕ ПО МОСКОВСКОМУ ВРЕМЕНИ ---
    function GreetingHeader() {
      const getGreeting = () => {
        const now = new Date();
        const mskHours = (now.getUTCHours() + 3) % 24;
        const mskMinutes = now.getUTCMinutes();
        const timeVal = mskHours * 100 + mskMinutes;

        if (timeVal >= 600 && timeVal <= 1100) {
          return { text: "Доброе утро, Дашуля ❤️", isMorning: true };
        } else if (timeVal >= 1101 && timeVal <= 2100) {
          const emojis = ['😊', '🌸', '✨', '☕', '🌟', '🥰', '🎈'];
          const randomEmoji = emojis[now.getDate() % emojis.length];
          return { text: `Добрый день, Дашуля ${randomEmoji}`, isMorning: false };
        } else {
          return { text: "Доброй ночи, Дашуля 🌙", isMorning: false };
        }
      };

      const greeting = getGreeting();

      return (
        <div className="pt-6 pb-2 px-6 flex justify-center">
          <div className="px-6 py-2.5 rounded-full backdrop-blur-xl border border-white/20 shadow-xl flex items-center gap-3 bg-white/10">
            <span className="text-lg md:text-xl font-medium tracking-wide">{greeting.text}</span>
          </div>
        </div>
      );
    }

    // --- ГЛАВНОЕ ПРИЛОЖЕНИЕ ---
    function App() {
      const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('dash_students')) || INITIAL_STUDENTS);
      const [themeId, setThemeId] = useState(() => localStorage.getItem('dash_theme') || 'spring');
      const [activeTab, setActiveTab] = useState('main');

      useEffect(() => { localStorage.setItem('dash_students', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('dash_theme', themeId); }, [themeId]);

      const currentTheme = THEMES.find(t => t.id === themeId) || THEMES[0];

      return (
        <div className="min-h-screen transition-all duration-500" style={{ background: currentTheme.bgGradient, color: currentTheme.text }}>
          <GreetingHeader />

          <main className="px-4 pb-24 max-w-xl mx-auto space-y-4 pt-2">
            {activeTab === 'main' ? (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h1 className="text-xl font-bold">Мои Ученики</h1>
                  <button onClick={() => {
                    const name = prompt("Имя ученика:");
                    if (name) setStudents([{ id: Date.now().toString(), name, language: 'English', totalLessons: 10, completedLessons: 0, startDate: '2026-10-24', endDate: '2026-11-24', history: [] }, ...students]);
                  }} className="px-3 py-1.5 rounded-xl bg-white/20 backdrop-blur-md border border-white/20 text-xs font-medium flex items-center gap-1">
                    <Plus className="w-4 h-4"/> Добавить
                  </button>
                </div>

                {students.map(student => {
                  const percent = Math.round((student.completedLessons / student.totalLessons) * 100);
                  return (
                    <div key={student.id} className="p-4 rounded-2xl border border-white/20 shadow-lg space-y-3" style={{ backgroundColor: currentTheme.cardBg }}>
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-bold text-base">{student.name}</h3>
                          <span className="text-[11px] opacity-70">{student.language} • До {student.endDate}</span>
                        </div>
                        <button onClick={() => setStudents(students.filter(s => s.id !== student.id))} className="text-red-400 p-1">
                          <Trash2 className="w-4 h-4"/>
                        </button>
                      </div>

                      <div className="space-y-1">
                        <div className="flex justify-between text-xs font-medium">
                          <span>Проведено: {student.completedLessons} из {student.totalLessons}</span>
                          <span>Осталось: {student.totalLessons - student.completedLessons}</span>
                        </div>
                        <div className="w-full h-2 bg-black/20 rounded-full overflow-hidden">
                          <div className="h-full bg-emerald-400 transition-all duration-300" style={{ width: `${percent}%` }} />
                        </div>
                      </div>

                      <button onClick={() => {
                        setStudents(students.map(s => s.id === student.id ? { ...s, completedLessons: Math.min(s.totalLessons, s.completedLessons + 1) } : s));
                      }} className="w-full py-2 rounded-xl text-xs font-medium text-white shadow-md flex items-center justify-center gap-1" style={{ backgroundColor: currentTheme.primary }}>
                        <CheckCircle2 className="w-4 h-4"/> + Провести урок
                      </button>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="space-y-4">
                <h1 className="text-xl font-bold">Выберите Тему</h1>
                <div className="grid grid-cols-2 gap-3">
                  {THEMES.map(t => (
                    <button key={t.id} onClick={() => setThemeId(t.id)} className="p-3 rounded-2xl border border-white/20 text-left text-xs font-medium flex items-center justify-between" style={{ background: t.bgGradient }}>
                      <span className="text-white drop-shadow">{t.icon} {t.name}</span>
                      {themeId === t.id && <Check className="w-4 h-4 text-white" />}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[85%] max-w-sm p-2 rounded-full border border-white/20 backdrop-blur-xl flex justify-around bg-white/10">
            <button onClick={() => setActiveTab('main')} className={`px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-1 ${activeTab === 'main' ? 'bg-white/30' : 'opacity-70'}`}>
              <Home className="w-4 h-4"/> Главная
            </button>
            <button onClick={() => setActiveTab('settings')} className={`px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-1 ${activeTab === 'settings' ? 'bg-white/30' : 'opacity-70'}`}>
              <SettingsIcon className="w-4 h-4"/> Настройки
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
